<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — The Citizen Store</title>
<script src="./supabase-js.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c6a45d;--bg:#0d0f14;--panel:#151923;--text:#e8e4d8;--muted:#9a958a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Libre Franklin',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{padding:20px;text-align:center;border-bottom:1px solid rgba(198,164,93,.25)}
  header h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold)}
  header p{color:var(--muted);font-size:.85rem;margin-top:4px}
  main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:28px 16px;text-align:center}
  .card{background:var(--panel);border:1px solid rgba(198,164,93,.3);border-radius:12px;padding:24px 20px}
  .card p{line-height:1.55;font-size:.95rem}
  input{display:block;width:100%;background:var(--bg);border:1px solid rgba(198,164,93,.3);border-radius:20px;color:var(--text);padding:12px 16px;font-size:.95rem;font-family:inherit;margin:10px 0}
  input:focus{border-color:var(--gold);outline:none}
  button{background:var(--gold);border:none;color:#111;border-radius:20px;padding:12px 24px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.95rem;margin-top:8px}
  button:disabled{opacity:.5;cursor:default}
  #msg{color:var(--muted);font-size:.9rem;margin-top:12px;line-height:1.5}
  #msg.error{color:#e8a0a0}
  a{color:var(--gold)}
  footer{text-align:center;color:var(--muted);font-size:.75rem;padding:16px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<nav style="max-width:760px;width:100%;margin:0 auto;padding:12px 16px 0;text-align:center;font-size:.9rem"><a href="./">← Back to Store</a> &nbsp;·&nbsp; <a href="assistant.html">AI Legal Assistant</a></nav>
<header>
  <h1>Reset your password</h1>
  <p>The Citizen Store</p>
</header>
<main>
  <div class="card">
    <p>Enter the email you signed up with. We will send you a reset link, good for 60 minutes. The link takes you to the page where you choose a new password.</p>
    <input id="reset-email" type="email" placeholder="Email" autocomplete="email">
    <button id="btn-send-link">Send reset link</button>
    <p id="msg"></p>
  </div>
  <p style="margin-top:16px;font-size:.9rem"><a href="assistant.html">Back to sign in</a></p>
</main>
<footer><a href="./">The Citizen Store</a> · thecitizenmovement.store</footer>
<script>
var SUPABASE_URL = "https://jesrbqrwbacuirwxbkis.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implc3JicXJ3YmFjdWlyd3hia2lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTU2OTcsImV4cCI6MjEwNzIzMTY5N30._LCnNC2JIjijt6n0u3kKestF5G2Zsjju4hEv1d1tImc";
var supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
/* The reset link lands on the project's Site URL (the homepage), where the
   new-password form lives. No redirectTo is passed, so Supabase uses it. */
function showMsg(text, isErr){
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = isErr ? 'error' : '';
}
document.getElementById('btn-send-link').addEventListener('click', async function(){
  var email = document.getElementById('reset-email').value.trim();
  if (!email) { showMsg('Enter your email first.', true); return; }
  if (!supabaseClient) { showMsg('Sign-in library failed to load — check connection and reload.', true); return; }
  var btn = document.getElementById('btn-send-link');
  btn.disabled = true; btn.textContent = 'Sending…';
  var res = await supabaseClient.auth.resetPasswordForEmail(email);
  btn.disabled = false; btn.textContent = 'Send reset link';
  if (res.error) { showMsg(res.error.message, true); return; }
  showMsg('Check your email — the reset link is good for 60 minutes. If it is not in your inbox, check spam.');
});
document.getElementById('reset-email').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-send-link').click(); }
});
</script>
</body>
</html>
